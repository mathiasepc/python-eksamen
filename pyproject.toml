# Basic project metadata.
[project]
name = "pokeexplorer"
version = "0.1.0"

# The project is designed to run on Python 3.11 and 3.12.
# Python 3.13+ is excluded to avoid compatibility issues with tools or libraries.
requires-python = ">=3.11,<3.13"

# Pytest configuration.
[tool.pytest.ini_options]
# Tells pytest where to look for test files.
testpaths = ["backend/tests"]

# Adds the backend folder to Python's import path during tests.
# This makes imports like "from app.services.stats import ..." work.
pythonpath = ["backend"]

# Ruff configuration.
[tool.ruff]
# Maximum allowed line length before Ruff reports a formatting/linting issue.
line-length = 100

# Ruff linting rules.
[tool.ruff.lint]
# E = pycodestyle errors
# F = pyflakes errors, such as unused imports or undefined names
# I = import sorting
# B = flake8-bugbear rules for common bug patterns
select = ["E", "F", "I", "B"]

# Pyright configuration.
[tool.pyright]
# Files and folders included in type checking.
include = ["backend/app", "backend/tests", "frontend"]

# Basic mode gives useful type checking without being too strict for this project.
typeCheckingMode = "basic"

# The Python version Pyright should use when analyzing the code.
pythonVersion = "3.11"