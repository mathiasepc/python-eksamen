[project]
name = "pokeexplorer"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = []

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.pyright]
include = ["backend/app", "backend/tests", "frontend"]
exclude = [".venv", "**/__pycache__"]
typeCheckingMode = "basic"
pythonVersion = "3.11"