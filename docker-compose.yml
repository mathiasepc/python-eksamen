services:
  backend:
    build:
      context: ./backend
    container_name: pokeexplorer-backend
    environment:
      - POKEAPI_BASE_URL=${POKEAPI_BASE_URL}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    ports:
      - "8001:8000"

  frontend:
    build:
      context: ./frontend
    container_name: pokeexplorer-frontend
    environment:
      - BACKEND_URL=http://backend:8000
    ports:
      - "8501:8501"
    depends_on:
      - backend